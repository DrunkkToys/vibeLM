name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. With `branches: [main]` here, a PR opened against any
  # other base — a stacked PR on top of another fix branch — matched nothing and silently showed no
  # checks at all. Retargeting it to main afterwards did not help either: changing a base emits
  # `pull_request: edited`, which is not one of the default activity types (opened, synchronize,
  # reopened), so nothing re-ran and the PR sat at zero checks looking hung. Only closing and
  # reopening it produced checks. Running on every PR regardless of base costs one extra run per
  # stacked PR and removes the trap.
  #
  # `types:` is intentionally left at its default. Adding `edited` would also fire CI on every title
  # and description edit.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
